<section class="card">
  <h2>Pembayaran</h2>

  <div class="price">
    Rp1.000
  </div>

  <p style="color:#888">
    Halaman pembayaran demo.
    Tidak ada transaksi yang diproses oleh website.
  </p>

  <button
    class="primary full"
    onclick="showPayment()">
    LANJUT
  </button>

  <div id="paymentInfo"
       style="display:none;margin-top:15px">

    <div class="status">
      Metode pembayaran: DANA
    </div>

    <div class="notice">
      Untuk versi produksi, gunakan metode pembayaran
      resmi yang sesuai dengan aturan layanan dan
      minta bantuan orang tua/wali untuk pengelolaannya.
    </div>

  </div>
</section>

<script>
function showPayment(){
  document.getElementById("paymentInfo").style.display="block";
}
</script>
